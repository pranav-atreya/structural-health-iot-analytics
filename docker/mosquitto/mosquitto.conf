# ============================================================================
# Eclipse Mosquitto 2.x Configuration — Structural Health IoT Analytics
# ============================================================================
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%SZ

# Listener on port 1883 for ESP32 and ingestion service on local LAN/Docker network
listener 1883 0.0.0.0
max_keepalive 120
max_packet_size 16384
