apiVersion: 1

providers:
  - name: "Structural Health IoT Dashboards"
    orgId: 1
    folder: "Structural Health IoT"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
